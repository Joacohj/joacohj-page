services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nextjs_app

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/myapp
      MINERU_URL: http://mineru:8000

    volumes:
      - ./:/app
      - /app/node_modules

    depends_on:
      db:
        condition: service_healthy
      mineru:
        condition: service_healthy

    command: sleep infinity

  db:
    image: postgres:18

    container_name: postgres_db

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myapp

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d myapp"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  mineru:
    build:
      context: ./docker/mineru
      dockerfile: Dockerfile

    container_name: mineru

    ports:
      - "8000:8000"

    command:
      - api-server
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tier
      - basic

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/v1/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s


volumes:
  postgres_data: